


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP Content - Premium Video Library</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 2rem;
    }
    .header { margin-bottom: 2.5rem; }
    .header h1 { font-size: 28px; font-weight: 500; margin-bottom: 0.25rem; color: #ffffff; }
    .header p { font-size: 13px; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .search-bar { display: flex; gap: 12px; margin-bottom: 2rem; flex-wrap: wrap; }
    .search-bar input {
      flex: 1; min-width: 250px; max-width: 500px; padding: 10px 16px;
      border: 0.5px solid rgba(255,255,255,0.15); border-radius: 8px;
      background: rgba(255,255,255,0.05); color: #ffffff; font-size: 14px;
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.4); }
    .btn-search {
      padding: 10px 24px; background: #ff5722; border: none; border-radius: 8px;
      color: white; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s;
    }
    .btn-search:hover { background: #ff7043; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; max-width: 1400px;
    }
    .card {
      background: rgba(30, 30, 50, 0.8); border: 0.5px solid rgba(255,255,255,0.1);
      border-radius: 12px; overflow: hidden; transition: transform 0.2s, border-color 0.2s;
      cursor: pointer; display: flex; flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.2); }
    .thumbnail-container {
      width: 100%; aspect-ratio: 16 / 9; background: #000;
      display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;
    }
    .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
    .duration {
      position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.7);
      color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 500;
    }
    .card-content { padding: 16px; display: flex; flex-direction: column; flex: 1; }
    .card-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; color: #ffffff; }
    .card-description { font-size: 13px; color: #aaa; line-height: 1.5; margin-bottom: 12px; flex: 1; }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 12px; border-top: 0.5px solid rgba(255,255,255,0.08);
    }
    .price { background: #ff5722; color: white; padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .note { font-size: 12px; color: #777; margin-top: 2rem; }
  </style>
</head>
<body>
  <div class="header">
    <h1>VIP Content</h1>
    <p>Premium Video Library</p>
  </div>
  
  <div class="search-bar">
    <input type="text" placeholder="Search VIP content...">
    <button class="btn-search">Search</button>
  </div>
  
  <div class="grid">
    <div class="card">
      <div class="thumbnail-container">
        <img src="PASTE_YOUR_GIF_URL_HERE" alt="A little bit of everything">
        <span class="duration">17:41</span>
      </div>
      <div class="card-content">
        <h3 class="card-title">A little bit of everything</h3>
        <p class="card-description">A little afternoon time to ourselves. I ride him, blow him and let him cum inside me</p>
        <div class="card-footer">
          <div class="price">$65</div>
        </div>
      </div>
    </div>
  </div>
  
  <p class="note">Shortened clips available by request</p>
</body>
</html>
